<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Actividades QR</title>
    <!-- Librería corregida para leer códigos QR -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        button { display: block; width: 100%; max-width: 200px; margin: 15px auto; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219150; }
        button.clear { background-color: #c0392b; }
        button.clear:hover { background-color: #a93226; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .bg-inicio { background-color: #f39c12; }
        .bg-final { background-color: #27ae60; }
        #audio-scan { display: none; }
    </style>
</head>
<body>

    <h1>⏱️ Control de Actividades</h1>
    
    <!-- Sección del Escáner -->
    <div class="card">
        <h2>Escanear Código QR</h2>
        <div id="reader"></div>
    </div>

    <!-- Sección de Registros -->
    <div class="card">
        <h2>Historial de Registros</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button onclick="exportarCSV()">📊 Exportar Excel/CSV</button>
            <button class="clear" onclick="limpiarHistorial()">🗑️ Limpiar Todo</button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Actividad / ID</th>
                        <th>Estado</th>
                        <th>Fecha / Hora</th>
                    </tr>
                </thead>
                <tbody id="tabla-registros">
                    <!-- Los datos se cargan dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Efecto de sonido al escanear (Beep libre de derechos) -->
    <audio id="audio-scan" src="https://google.com" preload="auto"></audio>

    <script>
        // Cargar registros iniciales de la memoria del teléfono
        let registros = JSON.parse(localStorage.getItem('registros_qr')) || [];
        let html5QrcodeScanner = null;

        function renderizarTabla() {
            const tbody = document.getElementById('tabla-registros');
            tbody.innerHTML = '';
            
            // Mostrar los más recientes primero
            [...registros].reverse().forEach(reg => {
                const tr = document.createElement('tr');
                const badgeClass = reg.tipo === 'Inicio' ? 'bg-inicio' : 'bg-final';
                
                tr.innerHTML = `
                    <td><strong>${reg.idActividad}</strong></td>
                    <td><span class="status-badge ${badgeClass}">${reg.tipo}</span></td>
                    <td>${reg.fechaHora}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function procesarEscaneo(textoQR) {
            // Reproducir sonido de escaneo de forma segura
            const audio = document.getElementById('audio-scan');
            audio.play().catch(e => console.log("Audio bloqueado por el navegador hasta interacción del usuario."));
            
            // Buscar si ya existe un inicio sin final para esta actividad específica
            const ultimoRegistro = [...registros].reverse().find(r => r.idActividad === textoQR);
            
            let tipoAccion = 'Inicio';
            if (ultimoRegistro && ultimoRegistro.tipo === 'Inicio') {
                tipoAccion = 'Final';
            }

            const nuevoRegistro = {
                idActividad: textoQR,
                tipo: tipoAccion,
                fechaHora: new Date().toLocaleString('es-MX')
            };

            registros.push(nuevoRegistro);
            localStorage.setItem('registros_qr', JSON.stringify(registros));
            renderizarTabla();
            
            alert(`Registrado: ${tipoAccion} de "${textoQR}"`);
        }

        // Inicializar el escáner por primera vez
        function iniciarEscaner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Pausar momentáneamente destruyendo la instancia actual para evitar lecturas repetidas instantáneas
            html5QrcodeScanner.clear().then(() => {
                procesarEscaneo(decodedText);
                
                // Reiniciar escáner tras 2 segundos de pausa masiva
                setTimeout(() => {
                    iniciarEscaner();
                }, 2000);
            }).catch(err => {
                console.error("Error al limpiar el escáner: ", err);
            });
        }

        // Ejecutar inicialización inicial
        iniciarEscaner();

        // Función para exportar los datos a formato CSV (Excel)
        function exportarCSV() {
            if (registros.length === 0) return alert("No hay datos para exportar");
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // \uFEFF soluciona problemas de acentos en Excel
            csvContent += "Actividad/ID,Tipo de Registro,Fecha y Hora\n";
            
            registros.forEach(r => {
                csvContent += `"${r.idActividad}","${r.tipo}","${r.fechaHora}"\n`;
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `registro_actividades_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function limpiarHistorial() {
            if (confirm("¿Estás seguro de que deseas borrar todos los registros históricos?")) {
                registros = [];
                localStorage.removeItem('registros_qr');
                renderizarTabla();
            }
        }

        // Renderizar tabla al cargar la página por primera vez
        renderizarTabla();
    </script>
</body>
</html>
